specVersion: "4.0"
metadata:
  name: com.example.boilerplate
type: application
framework:
  name: SAPUI5
  version: "1.152.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: themelib_sap_horizon
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        omitTSFromBuildResult: true
        omitSourceMaps: true
        transformAsyncToPromise: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        generateTsInterfaces: false
        transformAsyncToPromise: true
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
        port: 35729
        host: localhost
        watchPath: webapp
        extraExts: ts,xml,json,properties
    - name: boilerplate-dev-index
      afterMiddleware: ui5-middleware-livereload
---
specVersion: "4.0"
kind: extension
type: server-middleware
metadata:
  name: boilerplate-dev-index
middleware:
  path: build/scripts/dev-index.cjs
